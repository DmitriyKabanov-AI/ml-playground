services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    image: ml-playground:latest
    container_name: ml-playground
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - jupyter-data:/root/.local/share/jupyter
    working_dir: /app
    env_file:
      - config/.env
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/api"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ml-frontend:latest
    container_name: ml-web
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      - ml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  jupyter-data:

