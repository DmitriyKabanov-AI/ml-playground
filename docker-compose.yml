services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: ml-db
    restart: unless-stopped
    env_file:
      - config/.env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
          pids: 256
        reservations:
          cpus: '0.05'
          memory: 64m
    shm_size: '128m'

  # ---------- Jupyter Lab ----------
  ml:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    image: ml-playground:latest
    container_name: ml-playground
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - jupyter-data:/root/.local/share/jupyter
      # Общий каталог event log: Spark History Server увидит задания notebook.
      - spark-events:/opt/bitnami/spark/events
    working_dir: /app
    env_file:
      - config/.env
    environment:
      PYTHONUNBUFFERED: "1"
      SPARK_MASTER_URL: "spark://spark-master:7077"
      WEATHER_EXECUTION_MODE: "auto"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/api"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 4g
          pids: 2048
        reservations:
          cpus: '0.5'
          memory: 1g
    shm_size: '1g'

  # ---------- FastAPI (inference) ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ml-api:latest
    container_name: ml-api
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - config/.env
    volumes:
      # Монтируем models/ снаружи — не тащим 3.4 ГБ в образ
      - ./models:/app/models:ro
      # artifacts/ — для отдачи расширенного report
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
          pids: 512
        reservations:
          cpus: '0.05'
          memory: 64m

  # ---------- Фронт: Next.js static → nginx ----------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ml-frontend:latest
    container_name: ml-web
    restart: unless-stopped
    ports:
      - "4173:80"
    volumes:
      # artifacts/ монтируем поверх html — nginx отдаёт их как статику.
      # Не нужно пересобирать образ при каждом обновлении артефактов.
      - ./artifacts:/usr/share/nginx/html/artifacts:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 256
        reservations:
          cpus: '0.05'
          memory: 64m

  # ---------- Spark: master ----------
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    restart: unless-stopped
    profiles: ["spark"]
    environment:
      SPARK_MODE: master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"    # Master UI
      - "7077:7077"    # Master RPC
    volumes:
      - ./spark-apps:/opt/bitnami/spark/apps:ro
      - ./artifacts:/opt/bitnami/spark/artifacts
      - spark-ivy:/bitnami/spark/.ivy2
      - spark-events:/opt/bitnami/spark/events
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
          pids: 1024
        reservations:
          cpus: '0.1'
          memory: 256m

  # ---------- Spark: worker ----------
  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    restart: unless-stopped
    profiles: ["spark"]
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "4"      # Spark видит 4 ядра, limit 4.5 — 0.5 на JVM
      SPARK_WORKER_MEMORY: "11g"   # limit 13g — 2g на overhead/off-heap/shuffle
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8081:8081"    # Worker UI
    volumes:
      - ./spark-apps:/opt/bitnami/spark/apps:ro
      - ./artifacts:/opt/bitnami/spark/artifacts
      - spark-work:/opt/bitnami/spark/work
      - spark-ivy:/bitnami/spark/.ivy2
      - spark-events:/opt/bitnami/spark/events
    shm_size: '2g'
    deploy:
      resources:
        limits:
          cpus: '4.5'
          memory: 13g
          pids: 4096
        reservations:
          cpus: '1.0'
          memory: 2g

  # ---------- Spark: history server ----------
  spark-history:
    image: bitnami/spark:3.5
    container_name: spark-history
    restart: unless-stopped
    profiles: ["spark"]
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: history-server
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=/opt/bitnami/spark/events
        -Dspark.history.ui.port=18080
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "18080:18080"  # History UI
    volumes:
      - spark-events:/opt/bitnami/spark/events:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 512
        reservations:
          cpus: '0.05'
          memory: 128m

volumes:
  jupyter-data:
  pg-data:
  spark-ivy:      # кэш jar-ов (postgres JDBC, pandas API и т.п.)
  spark-work:     # shuffle / temp
  spark-events:   # Spark event log для history server