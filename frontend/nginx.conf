server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> backend-контейнер "api", порт 8000 внутри сети
    # слэш в конце proxy_pass срезает префикс /api
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Артефакты моделей: JSON-отчёты, графики, index.json.
    # Монтируются в /usr/share/nginx/html/artifacts через docker-compose.
    # Отдаём с no-cache, чтобы после пересборки артефактов фронт сразу
    # видел свежие данные, а не закешированные.
    location /artifacts/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA: любой путь без файла отдаёт index.html.
    # В Next.js static export каждая страница — свой .html,
    # но 404-страницы и вложенные маршруты удобнее отдавать через index.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Хешированные ассеты Next.js (_next/static/...) кешируем агрессивно:
    # их имена меняются при каждой сборке, поэтому immutable безопасен.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Остальные статические файлы — кеш на неделю.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}